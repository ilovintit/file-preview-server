# file-preview-server 文档站：Hugo + OINK 主题，仅中文。
title: file-preview-server
baseURL: https://ilovintit.github.io/file-preview-server/
defaultContentLanguage: zh
enableGitInfo: true
enableRobotsTXT: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: file-preview-server
    hasCJKLanguage: true
    params:
      description: 签名受控的文件在线预览服务：图片、PDF 与 Office/WPS 文档。

# OINK 的 Markdown 组件依赖这三项 Goldmark 设置。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  github_repo: https://github.com/ilovintit/file-preview-server
  github_subdir: website
  github_branch: main
  copyright:
    authors: file-preview-server contributors
    from_year: 2026
  footer_center_info: 基于 Apache-2.0 许可发布
  ui:
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
