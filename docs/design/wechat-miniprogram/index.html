<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>附件列表 · 微信小程序原型</title><link rel="stylesheet" href="../prototype.css"></head>
<body><main class="shell"><div class="layout">
<aside><a href="../index.html">← 产品入口索引</a><p class="eyebrow">FILE PREVIEW / 01</p><h1>从附件，进入预览</h1><p>微信小程序 demo。点击附件后获取最新预览信息，再打开 H5 阅读页。</p>
<div class="panel"><strong>原型说明</strong><p>这是可点击的设计样稿。全部数据为合成数据，尚未连接服务，不代表微信开发者工具或真机验收通过。</p><p class="muted">附件 ID → 模拟详情请求 → 展示信息 → H5。原型不携带真实 token、源 URL 或密钥。</p></div>
<div class="panel"><strong>审查场景</strong><div class="scenarios"><button data-state="list">附件列表</button><button data-state="loading">获取中</button><button data-state="empty">无附件</button><button data-state="error">请求失败</button></div></div></aside>
<section class="phone" aria-label="微信小程序 demo"><div class="statusbar"><span>9:41</span><span>微信 ···</span></div><div class="nav">文件预览</div><div class="section"><h2>示例附件</h2><p>选择一份文件，查看内容</p>
<div id="list"><button class="file" data-id="photo"><span class="badge">PNG</span><span><strong>山野风景.png</strong><small>图片 · 预览示例</small></span><span class="chevron">›</span></button><button class="file" data-id="pdf"><span class="badge">PDF</span><span><strong>项目说明.pdf</strong><small>PDF 文档 · 预览示例</small></span><span class="chevron">›</span></button><button class="file" data-id="office"><span class="badge">DOCX</span><span><strong>使用指南.docx</strong><small>Office 文档 · 转换为 PDF</small></span><span class="chevron">›</span></button><p class="muted">这里仅包含本仓库维护的示例文件。</p></div>
<div id="feedback" class="state" role="status" aria-live="polite" hidden></div></div></section></div></main>
<script>
const rows=document.getElementById('list'),feedback=document.getElementById('feedback');let sequence=0;
function show(state){
  sequence++;rows.hidden=state!=='list';feedback.hidden=state==='list';
  document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));
  if(state==='loading')feedback.innerHTML='<div class="symbol">···</div><h2>正在获取预览</h2><p>请稍候，正在读取最新文件信息</p>';
  if(state==='empty')feedback.innerHTML='<div class="symbol">—</div><h2>暂无示例附件</h2><p>附件准备好后将在这里显示</p><button class="secondary" id="reload">重新加载</button>';
  if(state==='error')feedback.innerHTML='<div class="symbol">!</div><h2>暂时无法获取预览</h2><p>请检查网络后重试</p><button class="primary" id="reload">重新加载</button>';
  const reload=document.getElementById('reload');if(reload)reload.onclick=()=>show('list');
}
async function detail(id){await new Promise(resolve=>setTimeout(resolve,700));return ({photo:{sample:'photo'},pdf:{sample:'pdf'},office:{sample:'office'}})[id];}
document.querySelectorAll('[data-id]').forEach(button=>button.onclick=async()=>{
  const id=button.dataset.id;show('loading');const current=sequence;const dto=await detail(id);
  if(current!==sequence)return;location.href='../preview-h5/index.html#sample='+encodeURIComponent(dto.sample);
});
document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>show(button.dataset.state));show('list');
</script></body></html>
