name: Build Image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true
        default: first
  push:
    tags: ['v*']

jobs:
  image:
    name: 构建并推送应用镜像
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.shw.top/actions/checkout@v4.2.2
      - name: 生成镜像标签
        id: metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*|'') echo "invalid image tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: 配置公司 Go 代理
        id: go_proxy
        shell: bash
        env:
          GO_TOKEN: ${{ secrets.GO_TOKEN }}
        run: |
          test -n "$GO_TOKEN"
          encoded="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["GO_TOKEN"],safe=""))')"
          echo "url=https://gop:${encoded}@gop.shw.top" >> "$GITHUB_OUTPUT"
      - name: 登录 Harbor
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.CI_HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.CI_HARBOR_PASSWORD }}
        run: |
          test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" | docker login reg.shw.top --username "$HARBOR_USERNAME" --password-stdin
      - name: 构建并推送
        shell: bash
        env:
          IMAGE: reg.shw.top/shw-project/file-preview-server:${{ steps.metadata.outputs.tag }}
          GO_PROXY: ${{ steps.go_proxy.outputs.url }}
        run: |
          docker build --platform linux/amd64 --secret id=go_proxy,env=GO_PROXY --label org.opencontainers.image.revision="$GITHUB_SHA" --tag "$IMAGE" .
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | tee image-digest.txt
