name: PR Gate
on:
  pull_request:
    branches: [dev, main, test]
  push:
    branches: [dev, main, test]
concurrency:
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速层（lint/typecheck/build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint（gofmt + go vet）
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
      - name: unit tests + build
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          go test ./...
          go build ./...

  heavy:
    name: 重型层（API/E2E/VRT）
    runs-on: ubuntu-latest
    needs: fast
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: API/E2E/VRT
        run: |
          echo "TODO: 技术栈命令落地后适配——起 docproc 服务跑 API 接口测试、E2E 与 VRT（截图 diff，不更新基线）"
          echo "依赖参考：valkey(localhost:6379)、gotenberg(sidecar 或 localhost:3000)"
