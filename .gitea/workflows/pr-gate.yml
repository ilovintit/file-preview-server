name: PR Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
concurrency:
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速层（lint/typecheck/build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: 文档链接与原型脚本语法
        run: python3 .gitea/scripts/check-docs.py
      - name: 原型 DOM 交互检查（不代替视觉与真机验收）
        run: |
          npm ci --prefix .gitea/checks --ignore-scripts --no-audit --no-fund
          node --test .gitea/checks/prototype.test.cjs
      - name: 设置 Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5.0.2
        with:
          go-version-file: go.mod
      - name: lint（gofmt + go vet）
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
      - name: unit tests + build
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          go test ./...
          go build ./...

  heavy:
    name: 重型层（API/E2E/VRT）
    runs-on: ubuntu-latest
    needs: fast
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4.2.2
      - name: API/E2E/VRT readiness
        run: |
          if [ ! -f go.mod ]; then
            echo "骨架期：尚未有服务模块或适用的 API/E2E/VRT 用例。"
            exit 0
          fi
          echo "::error::服务模块已存在；必须由对应交付 Issue 配置真实 API/E2E/VRT 命令与 Gotenberg 依赖，不能以占位 job 代替。"
          exit 1
