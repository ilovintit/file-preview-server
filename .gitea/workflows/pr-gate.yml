name: PR Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
concurrency:
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速层（lint/typecheck/build）
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.shw.top/actions/checkout@v4.2.2
      - name: 文档链接与原型脚本语法
        run: python3 .gitea/scripts/check-docs.py
      - name: 原型 DOM 交互检查（不代替视觉与真机验收）
        run: |
          npm ci --prefix .gitea/checks --ignore-scripts --no-audit --no-fund --cache .cache/npm
          node --test .gitea/checks/prototype.test.cjs
      - name: 设置 Go
        if: ${{ hashFiles('go.mod') != '' }}
        run: |
          GO_DOWNLOAD_BASE_URL=https://golang.google.cn/dl ./.gitea/scripts/ensure-go.sh
      - name: lint（gofmt + go vet）
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          source .gitea/scripts/go-env.sh
          git ls-files -z '*.go' | xargs -0 gofmt -l | tee .cache/gofmt.out
          test ! -s .cache/gofmt.out
          go vet ./...
      - name: unit tests + build
        run: |
          if [ ! -f go.mod ]; then echo "go.mod 不存在，骨架期跳过"; exit 0; fi
          source .gitea/scripts/go-env.sh
          go test ./internal/module/preview/...
          go build ./...

  heavy:
    name: 重型层（API/E2E/VRT）
    runs-on: ubuntu-latest
    needs: fast
    services:
      silo:
        image: reg.shw.top/ci-cache/ci-silo@sha256:15099b2b174fc842a9b323ecfc6fe1c506a2b67ff23e1c49cf4464675f367b0d
        credentials:
          username: ${{ secrets.CI_HARBOR_USERNAME }}
          password: ${{ secrets.CI_HARBOR_PASSWORD }}
        env:
          # Public fixture-only credentials; isolated per-run service, no host port.
          MINIO_ROOT_USER: preview-ci
          MINIO_ROOT_PASSWORD: preview-ci-isolated-service-only
      gotenberg:
        image: reg.shw.top/ci-cache/ci-gotenberg@sha256:0ec4b0a125c55ff1dfaed071cab30e0f37cc4326f7d53d903ee5b24e4f27fd85
        credentials:
          username: ${{ secrets.CI_HARBOR_USERNAME }}
          password: ${{ secrets.CI_HARBOR_PASSWORD }}
        env:
          LOG_LEVEL: debug
          API_TIMEOUT: 30s
          API_BODY_LIMIT: 34MB
          API_DISABLE_DOWNLOAD_FROM: 'true'
          LIBREOFFICE_AUTO_START: 'true'
          LIBREOFFICE_MAX_QUEUE_SIZE: '4'
          LIBREOFFICE_DENY_LIST: '.*'
          LIBREOFFICE_DENY_PRIVATE_IPS: 'true'
          LIBREOFFICE_DENY_PUBLIC_IPS: 'true'
          CHROMIUM_DISABLE_ROUTES: 'true'
        options: --memory 2g --cpus 2 --pids-limit 256 --tmpfs /tmp:rw,nosuid,nodev,size=536870912
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
    steps:
      - uses: https://git.shw.top/actions/checkout@v4.2.2
      - name: 设置 Go
        run: |
          GO_DOWNLOAD_BASE_URL=https://golang.google.cn/dl ./.gitea/scripts/ensure-go.sh
      - name: 实际 TLS API、Valkey 与 OSS 集成
        env:
          VALKEY_TEST_ADDR: valkey:6379
          GOTENBERG_TEST_URL: http://gotenberg:3000
          SILO_TEST_ENDPOINT: http://silo:9000
          SILO_TEST_ACCESS_KEY: preview-ci
          SILO_TEST_SECRET_KEY: preview-ci-isolated-service-only
          PREVIEW_CI_ALIYUN_OSS_ENDPOINT: ${{ vars.PREVIEW_CI_ALIYUN_OSS_ENDPOINT }}
          PREVIEW_CI_ALIYUN_OSS_PREVIEW_ENDPOINT: ${{ vars.PREVIEW_CI_ALIYUN_OSS_PREVIEW_ENDPOINT }}
          PREVIEW_CI_ALIYUN_OSS_REGION: ${{ vars.PREVIEW_CI_ALIYUN_OSS_REGION }}
          PREVIEW_CI_ALIYUN_OSS_BUCKET: ${{ vars.PREVIEW_CI_ALIYUN_OSS_BUCKET }}
          PREVIEW_CI_ALIYUN_OSS_PREFIX_BASE: ${{ vars.PREVIEW_CI_ALIYUN_OSS_PREFIX_BASE }}/${{ github.run_id }}
          PREVIEW_CI_OSS_SIGNED_URL_MAX_TTL_SECONDS: ${{ vars.PREVIEW_CI_OSS_SIGNED_URL_MAX_TTL_SECONDS }}
          PREVIEW_CI_OSS_CORS_ALLOWED_ORIGIN: ${{ vars.PREVIEW_CI_OSS_CORS_ALLOWED_ORIGIN }}
          PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_ID }}
          PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_SECRET }}
          PREVIEW_CI_ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_SECURITY_TOKEN }}
        run: |
          source .gitea/scripts/go-env.sh
          for browser in chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$browser" >/dev/null 2>&1; then "$browser" --version; fi
          done
          go test -race -tags integration -count=1 -v ./internal/module/preview/...

      - name: 隔离转换器失败诊断
        if: failure()
        env:
          PREVIEW_TEST_CONVERTER_CONTAINER: ${{ job.services.gotenberg.id }}
        run: |
          # Only the per-job converter receives repository-owned fixture bytes.
          # Never inspect provider containers or dump Actions environment values.
          test -n "$PREVIEW_TEST_CONVERTER_CONTAINER"
          docker logs --tail 150 "$PREVIEW_TEST_CONVERTER_CONTAINER" 2>&1

  browser:
    # Keep the established status context; this job now covers both profiles.
    name: S02 Chromium 图片与 PDF 跨域读取
    runs-on: ubuntu-latest
    needs: fast
    container:
      image: reg.shw.top/ci-cache/ci-playwright-toolchain@sha256:e7732b466aa4abbc88c03c5779e7fa3305fce697c63e803c08c7462a74774f32
      credentials:
        username: ${{ secrets.CI_HARBOR_USERNAME }}
        password: ${{ secrets.CI_HARBOR_PASSWORD }}
    services:
      silo:
        image: reg.shw.top/ci-cache/ci-silo@sha256:15099b2b174fc842a9b323ecfc6fe1c506a2b67ff23e1c49cf4464675f367b0d
        credentials:
          username: ${{ secrets.CI_HARBOR_USERNAME }}
          password: ${{ secrets.CI_HARBOR_PASSWORD }}
        env:
          MINIO_ROOT_USER: preview-ci
          MINIO_ROOT_PASSWORD: preview-ci-isolated-service-only
      valkey:
        image: valkey/valkey:8
    steps:
      - uses: https://git.shw.top/actions/checkout@v4.2.2
      - name: 设置 Go
        run: |
          GO_DOWNLOAD_BASE_URL=https://golang.google.cn/dl ./.gitea/scripts/ensure-go.sh
      - name: 实际浏览器定向验证
        shell: bash
        env:
          VALKEY_TEST_ADDR: valkey:6379
          SILO_TEST_ENDPOINT: http://silo:9000
          SILO_TEST_ACCESS_KEY: preview-ci
          SILO_TEST_SECRET_KEY: preview-ci-isolated-service-only
          PREVIEW_CI_ALIYUN_OSS_ENDPOINT: ${{ vars.PREVIEW_CI_ALIYUN_OSS_ENDPOINT }}
          PREVIEW_CI_ALIYUN_OSS_PREVIEW_ENDPOINT: ${{ vars.PREVIEW_CI_ALIYUN_OSS_PREVIEW_ENDPOINT }}
          PREVIEW_CI_ALIYUN_OSS_REGION: ${{ vars.PREVIEW_CI_ALIYUN_OSS_REGION }}
          PREVIEW_CI_ALIYUN_OSS_BUCKET: ${{ vars.PREVIEW_CI_ALIYUN_OSS_BUCKET }}
          PREVIEW_CI_ALIYUN_OSS_PREFIX_BASE: ${{ vars.PREVIEW_CI_ALIYUN_OSS_PREFIX_BASE }}/${{ github.run_id }}/browser
          PREVIEW_CI_OSS_SIGNED_URL_MAX_TTL_SECONDS: ${{ vars.PREVIEW_CI_OSS_SIGNED_URL_MAX_TTL_SECONDS }}
          PREVIEW_CI_OSS_CORS_ALLOWED_ORIGIN: ${{ vars.PREVIEW_CI_OSS_CORS_ALLOWED_ORIGIN }}
          PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_ID }}
          PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_ACCESS_KEY_SECRET }}
          PREVIEW_CI_ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.PREVIEW_CI_ALIYUN_OSS_SECURITY_TOKEN }}
        run: |
          source .gitea/scripts/go-env.sh
          xvfb-run -a go test -tags 'integration browser' -count=1 -v -run '^(TestTC_S02_BrowserNavigation|TestTC_S04_AC04_SiloBrowserNavigation)$' ./internal/module/preview
      - uses: https://git.shw.top/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        if: always()
        with:
          name: dual-profile-browser-screenshots
          path: .cache/browser-artifacts
          if-no-files-found: error
          retention-days: 7
