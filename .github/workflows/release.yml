name: Release
# 推送 v* tag 时构建应用镜像，同时推送 Docker Hub（主）与 GHCR（备），并创建 GitHub Release。
# Docker Hub 需要仓库 Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN；未配置时只推 GHCR。
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  image:
    name: 构建并推送应用镜像
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: docker.io/ilovintit/file-preview-server
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 选择推送目标
        id: targets
        run: |
          images="$GHCR_IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ]; then images="$DOCKERHUB_IMAGE"$'\n'"$images"; fi
          { echo 'images<<EOF'; echo "$images"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 转换器 sidecar 只固定了 linux/amd64，应用镜像保持同一架构。
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: 记录镜像 digest
        run: |
          {
            echo "### 已发布镜像"
            echo
            while read -r image; do echo "- \`${image}@${{ steps.build.outputs.digest }}\`"; done <<< "${{ steps.targets.outputs.images }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" > release-notes.md
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file release-notes.md
