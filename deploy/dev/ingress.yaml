# dev 入口：同一 host 下的路径路由，阅读页、预览跳转与 playground 同源，
# 便于按入口分类失败。后端是 HTTPS（集群内自签证书），因此需要
# backend-protocol 注解；入口本身由集群按现有惯例以 HTTP 暴露。
# 对外 host 尚未登记，保留显式占位符，由 GitOps publisher 写入真实值。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-preview-server
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 34m
spec:
  ingressClassName: nginx
  rules:
    - host: preview-host-not-registered.invalid
      http:
        paths:
          - path: /reader/
            pathType: Prefix
            backend:
              service:
                name: file-preview-server
                port:
                  name: http
          - path: /v/
            pathType: Prefix
            backend:
              service:
                name: file-preview-server
                port:
                  name: http
          - path: /demo/
            pathType: Prefix
            backend:
              service:
                name: file-preview-playground
                port:
                  name: https
