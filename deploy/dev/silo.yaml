# dev 自管对象存储：仅供开发环境，emptyDir 存储，重启即丢失。
# 访问凭据由基础设施预置的 ConfigMap `file-preview-dev-silo` 提供，
# 本仓库不声明 Secret，也不写入任何真实凭据值。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-preview-silo
  labels:
    app.kubernetes.io/name: file-preview-silo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: file-preview-silo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-preview-silo
    spec:
      imagePullSecrets:
        - name: harbor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: silo
          image: reg.shw.top/ci-cache/ci-silo@sha256:15099b2b174fc842a9b323ecfc6fe1c506a2b67ff23e1c49cf4464675f367b0d
          envFrom:
            - configMapRef:
                name: file-preview-dev-silo
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: file-preview-silo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: file-preview-silo
  ports:
    - name: s3
      port: 9000
      targetPort: s3
