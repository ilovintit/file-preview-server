# dev 环境的非敏感结构化取值。凭据（OSS access key、caller HMAC key、
# playground 访问口令）与自签证书由基础设施预置的
# `file-preview-server-runtime` ConfigMap 提供，仓库内不含任何密钥。
#
# v1.1.0 起 dev 使用阿里云 OSS 测试 bucket 作为存储 profile：OSS 端点天然
# HTTPS，不依赖集群入口证书。集群内自管 silo 不再用于 dev 演示。
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-preview-server-defaults
data:
  LISTEN_ADDR: ":9501"
  KEY_NAMESPACE: "preview:dev"
  MAX_CACHE_TTL: "86400"
  GOTENBERG_URL: "http://localhost:3000"
  VALKEY_ADDR: "file-preview-valkey:6379"
  STORAGE_PROFILES: "aliyun-oss"
  # 受保护 API 要求真实 HTTPS；集群内用自签证书，文件由 runtime ConfigMap 挂载。
  TLS_CERT_FILE: "/etc/file-preview/tls/tls.crt"
  TLS_KEY_FILE: "/etc/file-preview/tls/tls.key"
