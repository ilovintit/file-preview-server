apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 开发环境：应用 + 自管 Valkey + playground 演示入口。存储使用阿里云 OSS
# 测试 bucket，不在集群内自管对象存储。test 与生产不使用本 overlay，
# 也不部署 playground。Fleet 目标与 namespace 由基础设施侧登记。
resources:
  - ../app
  - valkey.yaml
  - playground.yaml
patches:
  # 与基线同名的 ConfigMap 用 patch 合并键值，不能作为新资源再声明一次。
  - path: configmap.yaml
  - path: app-patch.yaml
  - path: ingress.yaml
