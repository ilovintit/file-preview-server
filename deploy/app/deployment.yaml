apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-preview-server
  labels:
    app.kubernetes.io/name: file-preview-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: file-preview-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-preview-server
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: file-preview-server
          # 部署时用 kustomize edit set image 换成已发布版本的 tag 或 digest；
          # 仓库内保留显式占位符，不使用浮动标签。
          image: docker.io/ilovintit/file-preview-server:UNPINNED-SEE-RELEASE-RECORD
          args: ["server"]
          ports:
            - name: http
              containerPort: 9501
          envFrom:
            - configMapRef:
                name: file-preview-server-defaults
            # 凭据（CALLER_KEYS_JSON、对象存储 AK、VALKEY_PASSWORD 等）由部署方
            # 自行创建同名 Secret 提供，本仓库不含任何凭据值。
            - secretRef:
                name: file-preview-server-runtime
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp
      volumes:
        - name: app-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
